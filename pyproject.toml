[project]
name = "labinacan"
dynamic = ["version"]
description = "The generic parts of an autoresearch project: its site, papers, posts, literature reviews, figures and social posts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Will Sackfield" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "click>=8.1.0",
    "jinja2>=3.1.3",
    "markupsafe>=2.1",
    "markdown-it-py>=4.0",
    "mdit-py-plugins>=0.6.1",
    "latex2mathml>=3.81.1",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "tldextract>=5.1",
]

[project.optional-dependencies]
# Upload of the built site to Cloudflare R2 (labinacan.sync.r2).
r2 = ["boto3>=1.34.0"]
# The scan of published text for personal data (labinacan.sensitive).
pii = ["presidio-analyzer>=2.2"]
# The layout of the literature map, docs/literature/map.json (labinacan.literature_map).
map = ["sentence-transformers>=5.0", "umap-learn>=0.5.7", "leidenalg>=0.10.2", "igraph>=0.11"]

[project.urls]
Homepage = "https://github.com/8W9aG/labinacan/"
Repository = "https://github.com/8W9aG/labinacan"
Template = "https://github.com/8W9aG/labinacan-template"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "boto3>=1.34.0", "presidio-analyzer>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "labinacan/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["labinacan"]

[tool.hatch.build.targets.sdist]
include = ["/labinacan", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests", "labinacan"]
addopts = "--doctest-modules"
