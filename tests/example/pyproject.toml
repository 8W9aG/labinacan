# An example project that uses labinacan. The tests read its config (tests/conftest.py),
# because the package's own modules read a project's config when they load.
[project]
name = "example"
version = "0.0.0"
description = "example: a project made with labinacan, for the package's tests."
maintainers = [{ name = "example", email = "contact@example.org" }]

[project.urls]
Homepage = "https://example.org/"
Repository = "https://github.com/8W9aG/labinacan"

[tool.labinacan]
# An example project's values, which the tests read through tests/conftest.py.
name = "labinacan"
package = "labinacan"
env_prefix = "LABINACAN"
linear_team = "LAB"
maintainer = "8W9aG"
hf_dataset = "8W9aG/labinacan-exchange"
generated = []
data_only = []
automatic_issue_workflows = []

[tool.labinacan.brand]
# labinacan's brand: a can on the 3 x 3 grid of the mark. Its lid row is full, its label
# column is full and its sides are two thirds full, so the shape reads without colour.
folder = "brand"  # the brand's files, inside the package
tile = "#0F172A"  # the mark's tile: Tailwind's slate-900
ink = { light = "#0F172A", dark = "#F8FAFC" }  # the wordmark
colours = { lid = "#94A3B8", side = "#2DD4BF", label = "#F59E0B" }
cells = [
  [0, 0, 3, "lid"], [1, 0, 3, "lid"], [2, 0, 3, "lid"],
  [0, 1, 2, "side"], [1, 1, 3, "label"], [2, 1, 2, "side"],
  [0, 2, 2, "side"], [1, 2, 3, "label"], [2, 2, 2, "side"],
]
# The site's links and highlights: Tailwind's teal shades.
accent = { 50 = "#f0fdfa", 100 = "#ccfbf1", 200 = "#99f6e4", 300 = "#5eead4", 400 = "#2dd4bf", 500 = "#14b8a6", 600 = "#0d9488", 700 = "#0f766e", 800 = "#115e59", 900 = "#134e4a", 950 = "#042f2e" }

